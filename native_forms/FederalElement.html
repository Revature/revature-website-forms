:root {
    --brand-dark: #011635;
    --brand-orange: #FF7014;
    --brand-yellow: #F9B200;
    --brand-pink: #E946C7;  
    --brand-purple: #9333EA;
    --gradient-primary: linear-gradient(135deg, #FF7014 0%, #F9B200 100%);
    --gradient-accent: linear-gradient(135deg, #FF7014 0%, #A100FE 100%);
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background: var(--gradient-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    color: var(--brand-dark);
}

.capabilities-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 600px;
}

/* Desktop Layout */
.desktop-view {
    position: relative;
    width: 550px;
    height: 550px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Single flowing circular path */
.connection-path {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}

/* Background circle with plain color */
.background-circle {
    position: absolute;
    width: 480px;
    height: 480px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.15);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Gradient highlight overlay */
.gradient-highlight {
    position: absolute;
    width: 480px;
    height: 480px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    opacity: 0;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    z-index: 1;
}

.center-circle {
    position: relative;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    overflow: hidden;
    background: white;
    box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.1);
    z-index: 2;
}

.center-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 0.6s ease-in-out;
    opacity: 0;
}

.center-image.active {
    opacity: 1;
}

.capability-pill {
    position: absolute;
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 50px;
    padding: 0.875rem 1.5rem;
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--brand-dark);
    cursor: pointer;
    min-width: 240px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 3;
}

.capability-pill:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(1.02);
}

.capability-pill.selected {
    background: rgba(255, 255, 255, 0.35);
    border-color: rgba(255, 255, 255, 0.4);
    transform: scale(1.05);
    box-shadow: 0 15px 35px -8px rgba(0, 0, 0, 0.2);
}

.pill-text {
    flex: 1;
    text-align: center;
    font-weight: 600;
}

.pill-icon {
    position: absolute;
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 25px -8px rgba(0, 0, 0, 0.2);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
}

.pill-icon img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    transition: all 0.3s ease;
}

.capability-pill.selected .pill-icon {
    background: var(--gradient-accent);
    transform: scale(1.1);
}

.capability-pill.selected .pill-icon img {
    filter: brightness(0) invert(1);
}

/* Pill Positions - Fixed without translateY */
.pill-ai { top: 70px; left: -140px; }
.pill-data { top: 50%; left: -210px; margin-top: -25px; }
.pill-cloud { bottom: 70px; left: -140px; }
.pill-appdev { top: 70px; right: -160px; }
.pill-enterprise { top: 50%; right: -210px; margin-top: -25px; }
.pill-security { bottom: 70px; right: -140px; }

.pill-icon.right { right: -1.5rem; }
.pill-icon.left { left: -1.5rem; }

/* Mobile Layout */
.mobile-view {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.mobile-circle {
    position: relative;
    width: 320px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Mobile single circular path */
.mobile-connection-path {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}

/* Mobile background circle with plain color */
.mobile-background-circle {
    position: absolute;

}

/* Mobile gradient highlight overlay */
.mobile-gradient-highlight {
    position: absolute;

    pointer-events: none;
    z-index: 1;
}

/* Mobile gradient positions for each option */
.mobile-gradient-highlight.ai-selected {

.mobile-icon:hover:not(.icon-appdev):not(.icon-ai) {

.mobile-icon.selected:not(.icon-appdev):not(.icon-ai) {

@media (max-width: 768px) {

}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Desktop functionality
    const desktopImages = document.querySelectorAll('.desktop-view .center-image');
    const desktopPills = document.querySelectorAll('.desktop-view .capability-pill');
    const desktopGradientHighlight = document.querySelector('.desktop-view .gradient-highlight');

    const selectDesktopOption = (key) => {
        // Update images with smooth transition
        desktopImages.forEach(img => {
            if (img.dataset.key === key) {
                img.style.opacity = '0';
                setTimeout(() => {
                    img.classList.add('active');
                    img.style.opacity = '1';
                }, 150);
            } else {
                img.classList.remove('active');
                img.style.opacity = '0';
            }
        });
        
        // Update pills with smooth animation
        desktopPills.forEach(pill => {
            if (pill.dataset.key === key) {
                pill.classList.add('selected');
            } else {
                pill.classList.remove('selected');
            }
        });
        
        // Update gradient highlight
        desktopGradientHighlight.className = 'gradient-highlight';
        desktopGradientHighlight.classList.add(`${key}-selected`);
    };

    desktopPills.forEach(pill => {
        pill.addEventListener('click', (e) => {
            e.preventDefault();
            selectDesktopOption(pill.dataset.key);
        });
    });

    // Mobile functionality
    const mobileImages = document.querySelectorAll('.mobile-view .mobile-center img');
    const mobileIcons = document.querySelectorAll('.mobile-view .mobile-icon');
    const mobileGradientHighlight = document.querySelector('.mobile-view .mobile-gradient-highlight');
    const activeLabel = document.querySelector('.active-label');

    const selectMobileOption = (key, name) => {
        // Update images with smooth transition
        mobileImages.forEach(img => {
            if (img.dataset.key === key) {
                img.style.opacity = '0';
                setTimeout(() => {
                    img.classList.add('active');
                    img.style.opacity = '1';
                }, 150);
            } else {
                img.classList.remove('active');
                img.style.opacity = '0';
            }
        });
        
        // Update icons with smooth animation
        mobileIcons.forEach(icon => {
            if (icon.dataset.key === key) {
                icon.classList.add('selected');
            } else {
                icon.classList.remove('selected');
            }
        });
        
        // Update gradient highlight
        mobileGradientHighlight.className = 'mobile-gradient-highlight';
        mobileGradientHighlight.classList.add(`${key}-selected`);
        
        // Update label with smooth transition
        activeLabel.style.opacity = '0';
        setTimeout(() => {
            activeLabel.textContent = name;
            activeLabel.style.opacity = '1';
        }, 200);
    };

    mobileIcons.forEach(icon => {
        icon.addEventListener('click', (e) => {
            e.preventDefault();
            const key = icon.dataset.key;
            const name = icon.dataset.name;
            selectMobileOption(key, name);
        });
    });

    // Initialize with AI/ML selected by default
    selectDesktopOption('ai');
    selectMobileOption('ai', 'AI/ML & GenAI');
});
</script>

</body>
</html>
