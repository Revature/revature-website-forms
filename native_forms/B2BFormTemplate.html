<style>
    .grecaptcha-badge {
        position: relative !important;
        margin-bottom: 20px !important;
        right: auto !important;
    }

    .b2b-form-field {
        background-color: rgba(0, 0, 0, 0.10);
        border: 1px solid rgba(255, 255, 255, 0.13);
        padding: 12px 24px;
        border-radius: 8px;
        color: #fafafa;
    }

    .b2b-error-message {
        color: #F9B200;
        padding: 4px;
        text-align: left;
        line-height: 14px;
        display: block;
        margin-bottom: 8px;
    }

    .form-button {
        border-radius: 36px;
        font-size: 16px;
        padding: 8px 16px;
        color: #ffffff;
        background-color: #FF7014;
        border-color: #FF7014;
        float: left;
    }

    .b2b-form-field::placeholder {
        color: #ffffff;
        opacity: 0.4;
    }

    .two-grid-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-column-gap: 20px;
        grid-row-gap: 5px;
    }

    .one-grid-container {
        display: grid;
        grid-template-columns: repeat(1, 1fr);
        grid-column-gap: 20px;
        grid-row-gap: 5px;
    }

    @media screen and (max-width: 900px) {
        .two-grid-container {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            grid-column-gap: 20px;
            grid-row-gap: 5px;
        }
    }

    .custom-radio input[type="radio"] {
        display: none;
    }

    .custom-radio label {
        font-size: 18px;
        display: inline-block;
        width: 100%;
        height: 60px;
        text-align: center;
        line-height: 60px;
        cursor: pointer;
        background-color: #EBF1F4;
        border-radius: 10px;
    }

    .custom-radio input[type="radio"]:checked+label {
        background-color: #00183C;
        color: #fff;
    }

    .file-upload-container {
        display: inline-block;
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background-color: #EBF1F4;
        transition: background-color 0.1s ease-in-out;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
    }

    .file-upload-container input[type="file"] {
        position: absolute;
        visibility: hidden;
    }

    .file-upload-label {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
    }

    .file-upload-container:hover {
        background-color: #D7E6EE;
    }

    @keyframes spinner {
        to {
            transform: rotate(360deg);
        }
    }

    #loadSpinner {
        position: relative;
        width: 50px;
        height: 50px;
        margin-top: 10px;
        margin-left: 0;
    }

    .spinner:before {
        content: '';
        box-sizing: border-box;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        margin-top: -10px;
        margin-left: -10px;
        border-radius: 50%;
        border: 2px solid #ccc;
        border-top-color: #fff;
        animation: spinner .6s linear infinite;
    }
</style>

<form id="myForm">
    <div class="two-grid-container">
        <fieldset class="form-fieldset">
            <!-- <legend class="form-label">First Name</legend> -->
            <input class="b2b-form-field" type="text" name="firstName" placeholder="First Name">
            <span class="b2b-error-message" style="visibility: hidden;">-</span>
        </fieldset>
        <fieldset class="form-fieldset">
            <!-- <legend class="form-label">Last Name</legend> -->
            <input class="b2b-form-field" type="text" name="lastName" placeholder="Last Name">
            <span class="b2b-error-message" style="visibility: hidden;">-</span>
        </fieldset>
    </div>

    <div class="two-grid-container">
        <fieldset class="form-fieldset">
            <!-- <legend class="form-label">Job Title</legend> -->
            <input class="b2b-form-field" type="text" name="jobTitle" placeholder="Job Title">
            <span class="b2b-error-message" style="visibility: hidden;">-</span>
        </fieldset>
        <fieldset class="form-fieldset">
            <!-- <legend class="form-label">Company Name</legend> -->
            <input class="b2b-form-field" type="text" name="companyName" placeholder="Company Name">
            <span class="b2b-error-message" style="visibility: hidden;">-</span>
        </fieldset>

    </div>

    <div class="one-grid-container">
        <fieldset class="form-fieldset">
            <!-- <legend class="form-label">Business Email</legend> -->
            <input class="b2b-form-field" type="email" name="email" placeholder="Business Email">
            <span class="b2b-error-message" id="email-error-message" style="visibility: hidden;">-</span>
        </fieldset>
        <fieldset class="form-fieldset">
            <!-- <legend class="form-label">Phone Number</legend> -->
            <input class="b2b-form-field" type="phone" name="phone" maxlength="14" minlength="6"
                placeholder="Business Phone">
            <span class="b2b-error-message" id="phone-error-message" style="visibility: hidden;">-</span>
        </fieldset>
        <fieldset class="form-fieldset">
            <!-- <legend class="form-label">Your Message</legend> -->
            <textarea class="b2b-form-field b2b-form-textarea" name="yourMessage" placeholder="Your Message" rows="4" maxlength="500"></textarea>
            <span class="b2b-error-message" style="visibility: hidden;">-</span>
        </fieldset>
    </div>
    <div id="recaptcha-container" class="g-recaptcha"></div>
    <span class="b2b-error-message" id="recaptchaError" style="visibility: hidden;">-</span>
    <button type="submit" class="form-button" id="form-button">Let's Talk</button>
    <div id="loadSpinner"></div>
</form>

        const queryParamsString = window.location.search;
        const queryParams = new URLSearchParams(queryParamsString);

    function standardizeQueryParams(queryParams) {
        const standardizedQueryParams = {};

        queryParams.forEach((value, key) => {
            if (key === 'slug') {
                return;
            }
            const lowercasedKey = key.toLowerCase();
            standardizedQueryParams[lowercasedKey] = lowercasedKey.includes('utm') ? value.toLowerCase() : value;
